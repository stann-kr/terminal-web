<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TERMINAL Promo</title>
  <link rel="stylesheet" href="/palettes.css">
  <link rel="stylesheet" href="/globals.css">
  <style>
    body { min-height: 100vh; background: var(--field); padding: clamp(16px, 2vw, 32px); }
    .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding: 14px var(--pad); background: var(--panel); color: var(--panel-ink); }
    .top h1 { font: 400 clamp(30px, 3vw, 46px)/1 var(--brand); }
    .top p { color: var(--panel-muted); font: 700 var(--t-xs)/1.4 var(--display); letter-spacing: .14em; text-transform: uppercase; }
    section { margin-top: clamp(16px, 2vw, 28px); }
    h2 { margin-bottom: 10px; font: 700 var(--t-xl)/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
    h2 small { margin-left: 12px; color: var(--muted); font-size: var(--t-xs); letter-spacing: .14em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: var(--gap); align-items: start; }
    figure { margin: 0; display: grid; gap: 0; }
    .frame { position: relative; overflow: hidden; background: var(--inset); }
    .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
    figcaption { display: grid; gap: 6px; padding: 10px 12px 12px; background: var(--panel); color: var(--panel-ink); }
    figcaption b { font: 700 var(--t-lg)/1.1 var(--display); letter-spacing: .02em; }
    figcaption span { color: var(--panel-muted); font: 700 var(--t-xs)/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; }
    .links { display: flex; flex-wrap: wrap; gap: 4px; }
    .links a { display: inline-grid; place-items: center; min-height: 32px; padding: 0 10px; background: var(--panel-fill); color: var(--panel-on-fill); font: 700 var(--t-xs)/1 var(--display); letter-spacing: .14em; text-decoration: none; }
    .links a[data-open] { background: color-mix(in srgb, var(--panel-ink) 10%, transparent); color: var(--panel-ink); }
    @media (hover: hover) { .links a:hover { background: var(--panel-hi); color: var(--panel-on-hi); } }
  </style>
  <script type="module" src="index.js"></script>
</head>
<body>
  <header class="top">
    <h1>TERMINAL</h1>
    <p id="meta"></p>
  </header>
  <section aria-labelledby="posters">
    <h2 id="posters">Posters <small>포스터</small></h2>
    <div class="grid" data-set="posters"></div>
  </section>
  <section aria-labelledby="motion">
    <h2 id="motion">Motion <small>모션 · 반복 재생</small></h2>
    <div class="grid" data-set="motions"></div>
  </section>
  <section aria-labelledby="templates">
    <h2 id="templates">Templates <small>아티스트 확정 전 · 샘플 이름 · 내보내지 않음</small></h2>
    <div class="grid" data-set="templates"></div>
  </section>
</body>
</html>
