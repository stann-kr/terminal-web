name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:check-history
      # The lock cannot catch a migration rewritten together with its lock entry, so a PR is also
      # compared with its base branch: SQL and snapshots that branch already has must be unchanged.
      - name: Migrations unchanged since the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          npm run db:check-history -- --base FETCH_HEAD
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Next HTTP smoke
        run: |
          npm start > /tmp/terminal-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run smoke:http
      - run: npm run build:worker
      - name: Prepare local Worker D1
        run: npx wrangler d1 migrations apply terminal-db --local --env development
      - name: Worker HTTP smoke
        run: |
          npm run cf:preview > /tmp/terminal-worker.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          SMOKE_BASE_URL=http://127.0.0.1:8787 SMOKE_API=1 npm run smoke:http
      - run: npm run test:d1
      - run: npx wrangler deploy --env production --dry-run
